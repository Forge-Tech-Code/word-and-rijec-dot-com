<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ONLY THE TAGS THAT ARE IDENTICAL ON BOTH LANGUAGE PAGES LIVE HERE.
         The site is prerendered twice, as / (English) and /hr/ (Croatian),
         and everything that differs between them — <title>, the description,
         the canonical, hreflang, Open Graph, Twitter and the JSON-LD graph —
         is rendered per route by src/components/Seo.jsx. Adding any of those
         back here would emit it twice on every page.

         The `lang` attribute above is the English default; Seo.jsx overwrites
         it per locale, so the Croatian page ships lang="hr". -->

    <meta name="theme-color" content="#B8D6B2" />

    <!-- Icons. favicon.svg is the master; run scripts/build-icons.py to derive
         the PNGs (iOS home screen, the manifest, crawlers that will not
         rasterise an SVG) and then uncomment the two lines below. -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" /> -->
    <!-- <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" /> -->
    <link rel="manifest" href="./site.webmanifest" />

    <!-- Fonts — self-hosted, see public/fonts/ and the @font-face blocks in
         src/index.css. Only the faces the first screen actually needs are
         preloaded: Berkshire Swash for the wordmark, its latin-ext companion
         (the "č" in "Riječ" comes out of that file, in the h1), and Nunito
         for the body. The Nunito latin-ext loads on demand.

         The latin-ext half matters more now, not less: the Croatian page is
         full of č, ć, š, ž and đ from the first heading down. -->
    <link rel="preload" as="font" type="font/woff2" href="./fonts/berkshireswash-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="./fonts/berkshireswash-latin-ext.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="./fonts/nunito-latin.woff2" crossorigin />

    <!-- These './' paths are rewritten to '../' for /hr/index.html by the
         onPageRendered hook in vite.config.js — see the note there. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
